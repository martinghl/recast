# Read the Docs build configuration for FOCAL.
#
# The package itself is deliberately NOT installed here. Nothing in docs/ imports focal:
# conf.py reads the version out of focal/__init__.py as text, there is no autodoc, and the
# notebooks ship with their outputs already stored. Installing focal[attribution] would drag
# torch + scimilarity + scvi-tools onto the builder to produce exactly zero additional output.
version: 2

build:
  os: ubuntu-24.04
  tools:
    python: "3.12"

sphinx:
  configuration: docs/conf.py
  fail_on_warning: true

python:
  install:
    - requirements: docs/requirements.txt

formats:
  - pdf
